apply plugin: 'com.android.application'


// vophone version: comes from the git tag when GitHub builds a release (tag v1.2.3 -> -PvophoneVersion=1.2.3,
// see .github/workflows/release.yml). versionCode = 1000000 + major*10000 + minor*100 + patch, the same formula
// as GithubUpdater.versionCodeOf, so every release is newer than the one before (and than local builds).
def vophoneVersion = project.findProperty('vophoneVersion')
def vophoneVersionCode = { String version ->
    def match = version =~ /^(\d+)\.(\d+)\.(\d+)$/
    if (!match.matches() || match.group(2).toInteger() > 99 || match.group(3).toInteger() > 99)
        throw new GradleException("vophone version must look like 1.2.3 (minor and patch up to 99), got: " + version)
    return 1000000 + match.group(1).toInteger() * 10000 + match.group(2).toInteger() * 100 + match.group(3).toInteger()
}

android {
    compileSdkVersion 31
    defaultConfig {
        applicationId "com.bald.uriah.baldphone"
        minSdkVersion 21
        targetSdkVersion 29
        // Local builds: 103 (older than any GitHub release, so the phone takes the next release).
        versionCode vophoneVersion ? vophoneVersionCode(vophoneVersion) : 103
        versionName vophoneVersion ?: "0.0.0-local"
        // Where vophone looks for new versions (utils/GithubUpdater.java): the latest GitHub release of this repository.
        // -PvophoneUpdateApi=<url> points a test build somewhere else.
        buildConfigField "String", "UPDATE_API", "\"${project.findProperty('vophoneUpdateApi') ?: 'https://api.github.com/repos/dhqdev/vophone/releases/latest'}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [fullApp: "true", notFullApp: "false", recentCalls: "true", notRecentCalls: "false"]

    }

    // Fixed debug key kept in the repo, so every build (any computer / session) can update the
    // vophone already installed on the phone. As device owner, vophone cannot simply be uninstalled
    // and reinstalled with a different key.
    signingConfigs {
        debug {
            storeFile file('vophone-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
            signingConfig signingConfigs.debug
        }

    }


    flavorDimensions "updating_mechanism"
    productFlavors {
        baldUpdates {
            dimension "updating_mechanism"
        }
        fDroid {
            dimension "updating_mechanism"
        }
        gPlay {
            dimension "updating_mechanism"
            applicationIdSuffix ".gp"
            manifestPlaceholders = [fullApp: "true", notFullApp: "false", recentCalls: "false", notRecentCalls: "true"]
        }
        gPlayRecentCalls {
            dimension "updating_mechanism"
            applicationIdSuffix ".gprc"
            manifestPlaceholders = [fullApp: "false", notFullApp: "true", recentCalls: "true", notRecentCalls: "false"]
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.room:room-runtime:2.2.5'
    annotationProcessor 'androidx.room:room-compiler:2.2.5'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.2.0-beta01'
    implementation 'androidx.legacy:legacy-support-core-ui:1.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'net.danlew:android.joda:2.10.6'
    implementation 'com.android.volley:volley:1.2.1'
    implementation "ch.acra:acra-http:5.6.1"
    implementation 'androidx.exifinterface:exifinterface:1.2.0'
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:11.0.1'
    // Only for tests
    androidTestImplementation 'androidx.test:rules:1.2.0'
    androidTestImplementation 'com.tomash:androidcontacts:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
    testImplementation 'junit:junit:4.13'

    //Problematic library
    implementation 'androidx.appcompat:appcompat:1.1.0'
}


