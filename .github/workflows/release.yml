# Publishes a new vophone version.
#
# Push a tag like v1.2.3 and GitHub builds the APK and publishes it as a release.
# Phones with vophone find it by themselves (utils/GithubUpdater.java) and update.
#   git tag v1.2.3
#   git push origin v1.2.3
# See docs/ATUALIZACOES.md.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: android-actions/setup-android@v3

      - name: Build the APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleFDroidDebug -PvophoneVersion="$VERSION"
          cp app/build/outputs/apk/fDroid/debug/app-fDroid-debug.apk "vophone-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: vophone-${{ github.ref_name }}.apk
          generate_release_notes: true
