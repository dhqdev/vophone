# Publishes a new vophone version. Two ways:
#
# 1. On GitHub: Actions > Release > "Run workflow", type the new version (for example 1.0.1) and run.
# 2. Push a tag:   git tag v1.0.1 && git push origin v1.0.1
#
# GitHub builds the APK and publishes it as the release vX.Y.Z.
# Phones with vophone find it by themselves (utils/GithubUpdater.java) and update.
# See docs/ATUALIZACOES.md.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Nova versão, por exemplo 1.0.1 (sem o "v"). Sempre maior que a última.'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "::error::The version must look like 1.2.3, got: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The Android SDK tools need Java 17; the Gradle version of this project needs Java 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-31 build-tools;28.0.3'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build the APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleFDroidDebug -PvophoneVersion="${{ steps.version.outputs.version }}"
          cp app/build/outputs/apk/fDroid/debug/app-fDroid-debug.apk "vophone-${{ steps.version.outputs.tag }}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: vophone ${{ steps.version.outputs.tag }}
          files: vophone-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
