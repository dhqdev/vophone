# Checks that vophone still builds on pull requests.
# Pushes to master are built by release.yml, which also publishes them as a new version.
name: Android CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The Android SDK tools need Java 17; the Gradle version of this project needs Java 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-31 build-tools;28.0.3 build-tools;34.0.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # app/src/test: keyboards, Portuguese texts, version numbers and ROM permissions.
      - name: Test and build the APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testFDroidDebugUnitTest assembleFDroidDebug

      # The release signing script, both ways: without the private key (as now), and with a
      # throwaway key standing in for it (the real one only exists in the repository secrets).
      - name: Check the release signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/fDroid/debug/app-fDroid-debug.apk without-key.apk
          .github/scripts/sign-release.sh without-key.apk
          cp app/build/outputs/apk/fDroid/debug/app-fDroid-debug.apk with-key.apk
          export VOPHONE_RELEASE_PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore throwaway.p12 -storetype PKCS12 -alias vophone -keyalg RSA -keysize 4096 \
            -validity 36500 -dname "CN=vophone test" -storepass "$VOPHONE_RELEASE_PASSWORD" -keypass "$VOPHONE_RELEASE_PASSWORD"
          VOPHONE_RELEASE_KEYSTORE="$(base64 -w0 throwaway.p12)" .github/scripts/sign-release.sh with-key.apk
          rm -f throwaway.p12

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: vophone-apk
          path: app/build/outputs/apk/fDroid/debug/app-fDroid-debug.apk
