# Checks that vophone still builds, on every push to master and on pull requests.
name: Android CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The Android SDK tools need Java 17; the Gradle version of this project needs Java 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-31 build-tools;28.0.3'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Build the APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleFDroidDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vophone-apk
          path: app/build/outputs/apk/fDroid/debug/app-fDroid-debug.apk
